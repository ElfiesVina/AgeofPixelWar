name: Release APK

# Aturan:
#   Push ke branch import/preview-v0.4.0  -> otomatis jadi Pre-release (build belum tentu stabil)
#   Push ke branch main                   -> otomatis jadi Release stable (versi dari versionName di app/build.gradle.kts)

on:
  push:
    branches:
      - main
      - import/preview-v0.4.0

permissions:
  contents: write

env:
  PROJECT_DIR: .

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test (splash, home, lobi, game)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -m http.server 8000 --directory app/src/main/assets/www &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tools/smoke_test.mjs http://localhost:8000/index.html
      - name: Simpan screenshot jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: ${{ env.PROJECT_DIR }}/smoke-failure.png
          if-no-files-found: ignore

  release:
    needs: web-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (platform 36)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Tentukan jenis rilis
        id: meta
        run: |
          VERSION=$(grep -m1 'versionName' "${PROJECT_DIR}/app/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "apk=AgeofPixelWar${VERSION}.apk" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "title=Age of Pixel War ${VERSION} (stable)" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=preview-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "title=Age of Pixel War ${VERSION} preview #${GITHUB_RUN_NUMBER} (belum tentu stabil)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Beri nama APK sesuai versi
        run: cp "${PROJECT_DIR}"/app/build/outputs/apk/debug/*.apk "${{ steps.meta.outputs.apk }}"

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
          fail_on_unmatched_files: true
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # tombol "Run workflow" manual di tab Actions

env:
  # Folder proyek (yang berisi settings.gradle.kts). Jika proyek ada di dalam sub-folder repo, ubah di sini.
  PROJECT_DIR: .

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test (splash, home, lobi, game)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -m http.server 8000 --directory app/src/main/assets/www &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tools/smoke_test.mjs http://localhost:8000/index.html
      - name: Simpan screenshot jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: ${{ env.PROJECT_DIR }}/smoke-failure.png
          if-no-files-found: ignore

  build:
    needs: web-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (platform 36)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # Proyek belum punya gradlew, jadi Gradle dipasang langsung (versi sama dengan gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgeOfPixelWar-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
